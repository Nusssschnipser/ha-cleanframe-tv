name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_repo.py
      - run: python scripts/prepare_addon.py --check
      - run: dotnet build native-launcher/Launcher.csproj -o native-launcher/out --nologo
      - run: pip install homeassistant==2026.10.4 pytest pytest-asyncio
      - run: python -m pytest tests_ha -q
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cleanframe-tv-bridge:test cleanframe_tv_bridge
      - run: docker run --rm cleanframe-tv-bridge:test sdb version
